function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const dash = '<span class="no-val">—</span>';
function render(rows) {
  document.getElementById('tbody').innerHTML = rows.map(r => `<tr>
    <td class="firm">${esc(r.firm)}</td>
    <td class="contact">${r.contact ? esc(r.contact) : dash}</td>
    <td class="email">${r.email ? `<a href="https://mail.google.com/mail/?view=cm&to=${encodeURIComponent(r.email)}" target="_blank">${esc(r.email)}</a>` : dash}</td>
    <td class="hq">${r.hq ? esc(r.hq) : dash}</td>
    <td class="type">${r.type ? esc(r.type) : dash}</td>
    <td class="url"><a href="https://www.google.com/search?q=${encodeURIComponent(r.firm)}" target="_blank">↗</a></td>
    <td class="notes">${r.notes ? esc(r.notes) : dash}</td>
  </tr>`).join('');
  document.getElementById('count').textContent = rows.length.toLocaleString() + ' firms';
}
function filter() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const out = q ? DATA.filter(r => (r.firm+r.contact+r.email+r.hq+r.type+r.notes).toLowerCase().includes(q)) : DATA;
  render(out);
}
document.getElementById('header-meta').textContent = DATA.length + ' firms · ' + DATA.filter(r=>r.email).length + ' with email · waste management search June 2026';
render(DATA);
</script>
